<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResolveAI · Voice</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; --rec:#ef4444; --line:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 40px; display:flex; flex-direction:column; gap:16px; min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; flex:1; }
  select, input, button { font:inherit; }
  select { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:4px 8px; }
  #log { flex:1; display:flex; flex-direction:column; gap:10px; }
  .turn { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; }
  .turn.me { align-self:flex-end; max-width:85%; border-color:#1d4ed8; }
  .turn.ai { align-self:flex-start; max-width:85%; }
  .turn .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  .note { color:#fbbf24; font-size:13px; }
  .ptt { align-self:center; width:150px; height:150px; border-radius:50%; border:0; background:var(--accent); color:#04130a;
         font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 0 0 0 rgba(34,197,94,.5); transition:transform .1s; user-select:none; }
  .ptt.rec { background:var(--rec); color:#fff; animation:pulse 1.2s infinite; }
  .ptt:disabled { opacity:.5; cursor:wait; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(239,68,68,.6); } 100% { box-shadow:0 0 0 26px rgba(239,68,68,0); } }
  .hint { text-align:center; color:var(--muted); font-size:13px; }
  form { display:flex; gap:8px; }
  form input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  form button { padding:0 16px; border-radius:10px; border:0; background:#2563eb; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ResolveAI voice support</h1>
    <label>Language <select id="lang"><option value="auto">Auto</option><option value="hi-IN">हिन्दी</option><option value="en-IN">English</option></select></label>
  </header>
  <div id="log"></div>
  <button class="ptt" id="ptt">Hold to talk</button>
  <div class="hint" id="hint">Hold the button (or press and hold Space) and speak. Up to 30 seconds.</div>
  <form id="f"><input id="t" placeholder="Or type here if voice isn't working" autocomplete="off"><button>Send</button></form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let session = new URLSearchParams(location.search).get("session") || store.get("ra_voice_session");
if (!session) { session = "voice-" + crypto.randomUUID().slice(0, 8); store.set("ra_voice_session", session); }
let rec = null, chunks = [], started = 0, stopTimer = null, busy = false;

function add(cls, text, meta) {
  const d = document.createElement("div"); d.className = "turn " + cls; d.textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  $("log").appendChild(d); window.scrollTo(0, document.body.scrollHeight); return d;
}
function note(text) { const d = document.createElement("div"); d.className = "note"; d.textContent = text; $("log").appendChild(d); }

async function start() {
  if (rec || busy) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "" });
    chunks = []; started = Date.now();
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach((t) => t.stop()); send(new Blob(chunks, { type: rec.mimeType || "audio/webm" })); rec = null; };
    rec.start();
    $("ptt").classList.add("rec"); $("ptt").textContent = "Listening…";
    stopTimer = setTimeout(stop, 30000);
  } catch (e) { note("Microphone unavailable: " + e.message + ". You can type instead."); }
}
function stop() { clearTimeout(stopTimer); if (rec && rec.state === "recording") rec.stop(); $("ptt").classList.remove("rec"); $("ptt").textContent = "Hold to talk"; }

async function send(blob, text) {
  busy = true; $("ptt").disabled = true; $("hint").textContent = "Thinking…";
  const fd = new FormData();
  fd.append("session_id", session); fd.append("language", $("lang").value);
  if (blob) { fd.append("audio", blob, "voice.webm"); fd.append("seconds", String(Math.max(1, (Date.now() - started) / 1000))); }
  if (text) fd.append("text", text);
  try {
    const r = await fetch("/api/voice", { method: "POST", body: fd });
    const d = await r.json();
    if (d.transcript) add("me", d.transcript, d.language ? `heard as ${d.language}` : "");
    if (d.reply) {
      add("ai", d.reply, [d.reply_language, d.lane && d.lane.split(":")[1], d.latency_s && d.latency_s + "s"].filter(Boolean).join(" · "));
      if (d.audio_b64) new Audio("data:audio/wav;base64," + d.audio_b64).play().catch(() => note("Tap anywhere to allow audio playback."));
    } else if (d.mode === "human") { note("A teammate is handling this conversation."); }
    if (d.note) note(d.note);
  } catch (e) { note("Could not reach the server: " + e.message); }
  finally { busy = false; $("ptt").disabled = false; $("hint").textContent = "Hold the button (or press and hold Space) and speak. Up to 30 seconds."; }
}

const ptt = $("ptt");
ptt.addEventListener("pointerdown", (e) => { e.preventDefault(); start(); });
ptt.addEventListener("pointerup", stop); ptt.addEventListener("pointerleave", stop);
document.addEventListener("keydown", (e) => { if (e.code === "Space" && e.target === document.body && !e.repeat) { e.preventDefault(); start(); } });
document.addEventListener("keyup", (e) => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); stop(); } });
$("f").onsubmit = (e) => { e.preventDefault(); const t = $("t").value.trim(); if (t) { add("me", t); $("t").value = ""; send(null, t); } };
</script>
</body>
</html>
