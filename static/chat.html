<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResolveAI · Chat</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --me:#2563eb; --line:#e5e7eb; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:720px; margin:0 auto; height:100vh; display:flex; flex-direction:column; padding:12px 16px; }
  header { display:flex; align-items:center; gap:12px; padding:8px 0 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header small { color:var(--muted); }
  select, button, input { font:inherit; }
  #log { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:9px 13px; border-radius:14px; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; }
  .msg.me { align-self:flex-end; background:var(--me); color:#fff; border-color:var(--me); }
  .msg.human { border-color:#16a34a; }
  .meta { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .msg.me .meta { color:#dbeafe; }
  .typing { color:var(--muted); font-style:italic; align-self:flex-start; }
  form { display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--line); }
  form input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:10px; }
  form button { padding:0 18px; border:0; border-radius:10px; background:var(--me); color:#fff; cursor:pointer; }
  form button:disabled { opacity:.5; }
  .note { color:var(--warn); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">ResolveAI support</h1>
    <label>Language
      <select id="lang">
        <option value="auto">Auto</option><option value="en-IN">English</option><option value="hi-IN">हिन्दी</option>
      </select>
    </label>
    <button id="newchat" type="button">New chat</button>
    <small id="sid"></small>
  </header>
  <div id="log"></div>
  <form id="f"><input id="t" autocomplete="off" placeholder="Type your message…" autofocus><button id="send">Send</button></form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let session = new URLSearchParams(location.search).get("session") || store.get("ra_session");
if (!session) { session = "web-" + crypto.randomUUID().slice(0, 8); store.set("ra_session", session); }
$("sid").textContent = session;
const seen = new Set();

function add(cls, text, meta) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function showReply(id, text, meta, cls = "") {
  if (id && seen.has(id)) return;
  if (id) seen.add(id);
  add(cls, text, meta);
}

$("newchat").onclick = () => { store.set("ra_session", ""); location.search = ""; };

$("f").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("t").value.trim();
  if (!text) return;
  $("t").value = ""; $("send").disabled = true;
  add("me", text);
  const typing = add("typing", "…");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ session_id: session, text, language: $("lang").value, client_msg_id: crypto.randomUUID() }) });
    const d = await r.json();
    typing.remove();
    if (d.reply) {
      const note = d.meta && d.meta.translation_failed ? " · translation unavailable, replied in English" : "";
      showReply(d.message_id, d.reply, `${d.meta.lane || "fallback"} · ${d.meta.latency_s}s${note}`);
    } else if (d.meta && d.meta.mode === "human") {
      add("typing", "A teammate is handling this conversation…");
    }
  } catch (err) {
    typing.remove(); add("note", "Could not reach the server: " + err.message);
  } finally { $("send").disabled = false; $("t").focus(); }
};

// Pack-aware title: customer service keeps "ResolveAI support".
fetch("/api/config").then((r) => r.json()).then((cfg) => {
  const name = cfg.pack ? cfg.product : `${cfg.product} support`;
  $("title").textContent = name; document.title = `${name} · Chat`;
}).catch(() => {});

// Async messages for this session: approval outcomes and replies from a human teammate.
const es = new EventSource("/api/events?session=" + encodeURIComponent(session));
es.onmessage = (ev) => {
  const e = JSON.parse(ev.data);
  if (e.kind !== "message" || e.author === "customer") return;
  setTimeout(() => showReply(e.message_id, e.text, e.author === "human" ? `${e.author_name || "Teammate"} (human)` : "",
                             e.author === "human" ? "human" : ""), 400);
};
</script>
</body>
</html>
